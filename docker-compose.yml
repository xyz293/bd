services:
  mysql:
    image: mysql:8.0
    container_name: xiaoa-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: xiaoa
      MYSQL_USER: xiaoa
      MYSQL_PASSWORD: xiaoa_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - xiaoa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: xiaoa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - xiaoa_redis_data:/data

volumes:
  xiaoa_mysql_data:
  xiaoa_redis_data:
