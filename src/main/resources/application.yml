server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: xiaoa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/xiaoa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:xiaoa}
    password: ${MYSQL_PASSWORD:xiaoa_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: xiaoa-hikari
      minimum-idle: 2
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      connection-timeout: 30000
      validation-timeout: 5000
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 2s
    lettuce:
      pool:
        max-active: ${REDIS_MAX_ACTIVE:8}
        max-idle: ${REDIS_MAX_IDLE:8}
        min-idle: 0
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xiaoa
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

xiaoa:
  tenant:
    header-name: ${TENANT_HEADER_NAME:X-Tenant-Id}
    header-enabled: ${TENANT_HEADER_ENABLED:true}
